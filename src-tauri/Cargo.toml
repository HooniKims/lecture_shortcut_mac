[package]
name = "cue"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-updater = "2"
tempfile = "3.27.0"
tar = "0.4.46"
flate2 = "1.1.10"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
