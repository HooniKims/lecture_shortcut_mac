[package]
name = "native-process-regression"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "native-process-regression"
path = "src/main.rs"

[[bin]]
name = "cue-native"
path = "src/helper.rs"
